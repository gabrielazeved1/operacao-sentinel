global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    lab: sentinel

rule_files:
  - /etc/prometheus/sentinel/alerts.yml

scrape_configs:
  - job_name: rust
    static_configs:
      - targets: ["rust-a:8080", "rust-b:8080"]

  - job_name: watchdog
    static_configs:
      - targets: ["watchdog:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
